<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tilawa Share</title>
    <link rel="stylesheet" href="../../assets/share-page.css">
  </head>
  <body data-share-type="audio">
    <main class="wrap">
      <section class="hero">
        <p class="eyebrow" id="share-type">Tilawa Share</p>
        <h1 id="title">Geteilter Inhalt</h1>
        <p class="subtitle" id="subtitle">Diese Seite zeigt geteilte Ayat, Audio-Bereiche oder Lernpläne aus Tilawa.</p>
        <div class="grid">
          <div class="card"><span class="label">Sura</span><span class="value" id="surah">-</span></div>
          <div class="card"><span class="label">Bereich</span><span class="value" id="range">-</span></div>
          <div class="card"><span class="label">Modus</span><span class="value" id="mode">-</span></div>
          <div class="card"><span class="label">Plan</span><span class="value" id="plan">Kein Lernplan</span></div>
        </div>
        <div class="badge-row" id="badge-row"></div>
        <div class="actions">
          <a class="button button-primary" id="open-app-link" href="#">In Tilawa öffnen</a>
          <a class="button button-secondary" href="/">Zur Startseite</a>
        </div>
        <p class="footer-note">Wenn Tilawa auf deinem iPhone installiert ist und Universal Links aktiv sind, öffnet dieser Link direkt die App.</p>
      </section>
    </main>
    <script src="../../assets/share-page.js"></script>
  </body>
  </html>
