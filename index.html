<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tilawa</title>
    <style>
      :root {
        --bg: #07171d;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #f7f2e7;
        --muted: rgba(247, 242, 231, 0.72);
        --accent: #63e1cb;
        --accent-dark: #0f4b53;
        --gold: #e5d1a0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(99, 225, 203, 0.18), transparent 30%),
          linear-gradient(180deg, #0a2027 0%, var(--bg) 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .shell {
        width: min(760px, 100%);
        padding: 32px;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.25rem, 5vw, 3.5rem);
        font-weight: 600;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 20px;
        border-radius: 16px;
        text-decoration: none;
        font-weight: 700;
      }

      .button-primary {
        background: linear-gradient(135deg, var(--accent) 0%, #3fa99a 100%);
        color: #07353a;
      }

      .button-secondary {
        border: 1px solid var(--panel-border);
        color: var(--text);
      }

      .note {
        margin-top: 24px;
        font-size: 0.95rem;
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Tilawa</h1>
      <p>
        Teile Ayat, Audio-Bereiche und Lernpläne plattformunabhängig per Web-Link.
        Diese Seite ist die gemeinsame Basis für Browser, iPhone und später Android.
      </p>
      <div class="actions">
        <a class="button button-primary" href="/share/">Beispiel-Share öffnen</a>
        <a class="button button-secondary" href="https://www.gettilawa.com/share/reading?surah=2&from=255&to=257">Ayah-Beispiel</a>
        <a class="button button-secondary" href="/support/">Support</a>
      </div>
      <p class="note">
        Universal Links greifen auf iOS automatisch, sobald die App mit dieser Domain verknüpft ist.
      </p>
    </main>
  </body>
  </html>
